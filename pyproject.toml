[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sesh"
version = "0.1.0"
description = "Sync and analyze LLM session traces"
authors = [{name = "Tyson Chan", email = "tyson.chan@proton.me"}]
requires-python = ">=3.12"
dependencies = [
    "fncli",
]

[dependency-groups]
dev = [
    "ruff>=0.13.0",
    "pytest>=8.4.1",
    "pyright>=1.1.408",
]

[project.scripts]
sesh = "sesh.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sesh"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RET",
    "S",
    "PTH",
    "PERF",
    "RUF",
    "TID",
    "PIE",
    "FLY",
    "FURB",
    "PLC",
]
ignore = [
    "SIM108",
    "SIM115",
    "SIM117",
    "E501",
    "COM812",
    "S104",
    "D100", "D101", "D102", "D103", "D104", "D107",
    "D202", "D209", "D212", "D213", "D401", "D413", "D417",
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN401",
    "FBT001", "FBT002", "FBT003",
    "EM101", "EM102",
    "TRY003", "TRY300", "TRY301", "TRY400", "TRY401",
    "G004", "G201",
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
    "ARG001", "ARG004",
    "C901",
    "BLE001",
    "S603",
    "S607",
    "S108",
    "B008",
    "TID252",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S607", "S606"]

[tool.uv.sources]
fncli = { git = "https://github.com/iteebz/fncli.git" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
